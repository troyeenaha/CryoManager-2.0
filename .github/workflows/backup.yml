name: Nightly database backup

on:
  schedule:
    - cron: '17 7 * * *'   # every day at ~3 AM Eastern
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Run GitHub's own actions on the current Node version (Node 20 is being retired).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backup:
    # Pinned so a new Ubuntu release can't silently break the PostgreSQL client install.
    runs-on: ubuntu-24.04
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "Add the SUPABASE_DB_URL repository secret (see docs/BACKUP_AND_RECOVERY.md)"; exit 1; }
          FILE="cryomanager-$(date -u +%Y-%m-%d).dump"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth \
            --file="$FILE"
          /usr/lib/postgresql/17/bin/pg_restore --list "$FILE" > /dev/null   # verify the file is readable
          ls -lh "$FILE"
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Store backup (private artifact, 90 days)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 90
          if-no-files-found: error
